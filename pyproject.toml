[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optidx-desktop"
dynamic = ["version"]
description = "Linux desktop game mod manager"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["black==25.1.0", "ruff==0.11.13"]

[project.scripts]
optidx-desktop = "optidx_desktop.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "optidx_desktop.__version__"}

[tool.setuptools.packages.find]
include = ["optidx_desktop*", "backend*"]

[tool.setuptools.package-data]
optidx_desktop = ["assets/*.svg"]
backend = ["SNAPSHOT.json", "UPSTREAM_SNAPSHOT.json"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.py$'
extend-exclude = '/(build|dist)/'

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E731"]
